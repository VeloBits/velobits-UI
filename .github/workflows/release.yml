name: Release

# Publishes whatever main declares that the registry does not have yet, then tags
# it and cuts a GitHub Release per package.
#
#   push to main       → publish automatically
#   workflow_dispatch  → identical; a manual retry for a failed or partial publish
#
# Versioning is NOT here. It happens on develop via `prepare-release.yml`, because
# main's `protect-main` ruleset (pull request + 1 approving review + `verify`,
# bypass: OrganizationAdmin only) means no workflow can push a version commit to
# main. The version bump arrives through the develop → main PR instead.
#
# Deliberately NOT changesets/action. That action picks version-vs-publish from a
# switch on its own inputs, and two properties of it broke this pipeline before:
# an empty `publish` input made the post-merge run a 0-second green no-op, and a
# non-empty changeset directory routes it to "open a PR" no matter what else is
# set. Under this design changesets can legitimately be pending on main — feature
# PRs land on develop after a prepare — so that second branch would hijack every
# release. `changeset publish` on its own has no such switch: it publishes what is
# unpublished and skips the rest.
on:
  push:
    branches: [main]
  workflow_dispatch:

# No cancel-in-progress: a half-cancelled release publishes some packages and tags
# none of them.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # The repo default branch is develop, so the manual "Run workflow" picker
    # defaults to it. Publishing is only ever correct from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags, so the release step can tell what is already published, and so
          # `changeset publish` does not re-tag.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          # This is what writes the auth line into a temporary .npmrc. The
          # committed .npmrc deliberately carries only the registry mapping —
          # npm hard-fails on an unresolvable ${VAR} in it.
          registry-url: https://registry.npmjs.org

      # npm answers "you may not write here" with 404 on the PUT, not 403, so the
      # registry never confirms which names exist in a scope you cannot see. The
      # cost is that `changeset publish` reports "E404 Not Found - PUT
      # …/<scope>%2ficons — Not found" for a package it is itself trying to create,
      # which reads like a missing dependency and is actually a permission. Two
      # full release runs died that way in Aug 2026 before it was read as auth —
      # the scope in use then belonged to someone else. See .npmrc for that history.
      #
      # So resolve the token to an account BEFORE the build, and print who owns the
      # scope next to who we are, because "those two names differ" IS the failure
      # and npm will not say it.
      - name: Preflight npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set on this repository, so nothing can be published. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if ! who=$(npm whoami --registry=https://registry.npmjs.org 2>&1); then
            echo "$who"
            echo "::error::NPM_TOKEN does not resolve to an npm account — it is revoked, expired, or not an npm token. Issue a new one and update the secret."
            exit 1
          fi
          echo "Publishing as npm user: $who"

          # Write access on npm is granted per scope, and every publishable package
          # here shares one, so a single membership check covers the whole release.
          scope=$(node -e '
            const fs = require("fs");
            const scopes = new Set(fs.readdirSync("packages")
              .map(d => { try { return JSON.parse(fs.readFileSync(`packages/${d}/package.json`, "utf8")); } catch { return null; } })
              .filter(p => p && p.private !== true && p.name.startsWith("@"))
              .map(p => p.name.split("/")[0].slice(1)));
            process.stdout.write([...scopes].join(" "));
          ')

          for s in $scope; do
            # Status and body separately, because they mean different things and an
            # earlier version of this step conflated them: `curl -f … || echo '{}'`
            # turned a 404 into the same empty map a real org returns, so "the scope
            # does not exist" — hard, actionable, knowable — arrived as the warning
            # for "members are private". Read them apart.
            #
            #   404          the name is unregistered. Nothing can publish into it.
            #   200 {"u":…}  a USER scope. Membership is public, so check it.
            #   200 {}       an ORG. Members are private to unauthenticated reads,
            #                so ask npm as ourselves, below.
            body=$(curl -sSL -o "$RUNNER_TEMP/members.json" -w '%{http_code}' \
              "https://registry.npmjs.org/-/org/$s/user") || body=000
            members=$(cat "$RUNNER_TEMP/members.json" 2>/dev/null || echo '{}')
            echo "GET /-/org/$s/user -> HTTP $body  $members"

            if [ "$body" = "404" ]; then
              echo "::error::The '@$s' scope does not exist on npm — the name '$s' is not a registered org or user. Create the org first; a scope with no account behind it can never be published to."
              exit 1
            fi

            if ! node -e 'const m=JSON.parse(process.argv[1]); process.exit(Object.keys(m).length===0?1:0)' "$members" 2>/dev/null; then
              # An org. Ask the registry with our own credentials — this is the only
              # check that distinguishes "not a member" from "member, cannot list",
              # and not-a-member is precisely what produces the masked 404.
              if roles=$(npm org ls "$s" --json 2>/dev/null); then
                if node -e 'process.exit(Object.keys(JSON.parse(process.argv[1])).includes(process.argv[2])?0:1)' "$roles" "$who" 2>/dev/null; then
                  echo "'$who' is a member of the '$s' org: $(node -p "JSON.parse(process.argv[1])[process.argv[2]]" "$roles" "$who")"
                else
                  echo "::error::npm user '$who' is NOT a member of the '$s' org, so the publish will fail with a masked E404 on PUT. Add '$who' to the org with write access, or issue NPM_TOKEN from an account that already has it. Members seen: $roles"
                  exit 1
                fi
              else
                echo "::warning::'@$s' is a registered org but its members could not be enumerated with this token. That is expected for a restricted role, and also what a token scoped to a DIFFERENT org looks like — if the publish below fails with E404 on PUT, re-issue NPM_TOKEN against '@$s' specifically."
              fi
            else
              # A user scope: the owner is public, so this is decidable here.
              if ! node -e 'process.exit(Object.keys(JSON.parse(process.argv[1])).includes(process.argv[2])?0:1)' "$members" "$who"; then
                echo "::error::'@$s' is the personal scope of another npm account, not '$who'. Publish from the account that owns it, or move these packages to a scope you control."
                exit 1
              fi
              echo "'$who' owns the '@$s' scope."
            fi

            # The trap per-package granular tokens fall into, said out loud because
            # it produces the same unreadable E404 as having no access at all.
            echo "::notice::A granular token must grant read+write on the WHOLE '@$s' scope. Per-package selection cannot cover a package the registry does not have yet — which is every package in a first publish."
          done

      # No auth needed to install: every @velobits/* dep here is a workspace
      # link, resolved locally and never fetched.
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify publishable output before releasing
        run: npm run package:check

      # A notice rather than a failure: under this design pending changesets on
      # main are normal — they are next cycle's release, queued on develop and
      # carried along by a develop → main merge. Worth saying out loud though,
      # because it also describes the mistake of merging to main without running
      # Prepare release, where this job correctly publishes nothing.
      - name: Note pending changesets
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "::notice::$pending changeset(s) pending on main. They are not part of this release; run Prepare release on develop to version them."
          fi

      # `changeset publish` tags with `git tag <tag> -m <tag>`, and -m makes it an
      # ANNOTATED tag, which git refuses to write without a committer identity.
      # changesets discards that call's return value, so the failure surfaces
      # nowhere: it still prints "New tag: …", and the subsequent push honestly
      # reports "Everything up-to-date" because no tag was ever created. That is
      # exactly how 0.2.0 reached npm untagged and unreleased.
      #
      # changesets/action did this internally via setupUser(). Hand-rolling the
      # publish means doing it here.
      - name: Configure git identity
        run: |
          git config user.name  "Saurabh Yadav"
          git config user.email "sauraj.contact@gmail.com"

      # Does not fail the job. A multi-package publish can fail on one package
      # after succeeding on another, and when it does, the tags and Releases for
      # what DID publish still need to be created — otherwise npm has a version
      # with no tag and no notes. The gate at the end turns this red.
      - name: Publish to npm
        id: publish
        env:
          # Both point at the same secret: setup-node consumes NODE_AUTH_TOKEN for
          # the temp .npmrc it writes. NPM_TOKEN is here so anything else in the
          # release path that reads the conventional name finds it too.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          code=0
          # `release` is `turbo run build && changeset publish`. The rebuild is
          # deliberate: the Build step above ran before nothing, but turbo keys its
          # cache on the package version, so this is where post-bump artifacts get
          # produced. `changeset publish` then skips every version already on npm.
          npm run release 2>&1 | tee "$RUNNER_TEMP/publish.log" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::error::changeset publish exited $code. Tags and Releases for whatever did publish are still created below; rerun this workflow to retry the rest."
          fi

      # Authoritative, and deliberately not dependent on `changeset publish` having
      # tagged anything. The rule is "every version the registry has gets a tag",
      # which covers three cases with one pass: what this run just published, what
      # a previous run published before failing to tag it, and what changesets
      # silently failed to tag. Without the npm check it would also tag versions
      # main declares but never shipped, which is an unfinished release, not a
      # missing tag.
      #
      # This is what recovers an already-published version: `changeset publish`
      # skips it forever once it is on the registry, so it will never be tagged by
      # the publish step again, no matter how many times the workflow is rerun.
      - name: Tag every published version
        if: always() && steps.publish.conclusion != 'skipped'
        run: |
          tagged=0
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            private=$(node -p "require('./$dir/package.json').private === true")
            [ "$private" = "false" ] || continue

            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            tag="$name@$version"

            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "$tag already tagged."
              continue
            fi
            if ! npm view "$tag" version > /dev/null 2>&1; then
              echo "$tag is not on npm — not tagging an unshipped version."
              continue
            fi

            # Annotated, to match the tags changesets writes.
            git tag -a "$tag" -m "$tag"
            echo "Tagged $tag."
            tagged=$((tagged + 1))
          done

          if [ "$tagged" -gt 0 ]; then
            git push origin --tags
          else
            echo "No new tags to push."
          fi

      # Idempotent and self-healing: a Release is created for any tag that exists
      # without one, so a rerun after a partial failure fills the gaps instead of
      # erroring on the Releases that already exist.
      - name: Cut GitHub Releases
        if: always() && steps.publish.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/notes.cjs" <<'NODEEOF'
          // Slices one version's section out of a CHANGELOG, for the Release body.
          const fs = require("fs");
          const [dir, version] = process.argv.slice(2);
          const fallback = "See CHANGELOG.md.";
          let lines;
          try {
            lines = fs.readFileSync(dir + "/CHANGELOG.md", "utf8").split("\n");
          } catch (e) {
            process.stdout.write(fallback);
            process.exit(0);
          }
          const start = lines.findIndex((l) => l.trim() === "## " + version);
          if (start === -1) {
            process.stdout.write(fallback);
            process.exit(0);
          }
          let end = lines.length;
          for (let i = start + 1; i < lines.length; i++) {
            if (/^## /.test(lines[i])) {
              end = i;
              break;
            }
          }
          const body = lines.slice(start + 1, end).join("\n").trim();
          process.stdout.write(body || fallback);
          NODEEOF

          created=0
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            private=$(node -p "require('./$dir/package.json').private === true")
            [ "$private" = "false" ] || continue

            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            tag="$name@$version"

            if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "No tag $tag — $name@$version was not published by this run."
              continue
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "Release $tag already exists."
              continue
            fi

            node "$RUNNER_TEMP/notes.cjs" "$dir" "$version" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Created release $tag."
            created=$((created + 1))
          done
          echo "Created $created release(s)."

      # Reports OBSERVED state — the registry, the remote, the Releases API — not
      # what any tool claimed to have done. `changeset publish` printing
      # "New tag: …" for a tag it silently failed to create is exactly why: the
      # earlier version of this step grepped for that line and would have reported
      # 0.2.0 as fully released. Anything reading NO here is a real gap.
      - name: Summary
        if: always() && steps.publish.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Release"
            echo
            echo "| Package | Version | On npm | Tagged | Release |"
            echo "| --- | --- | --- | --- | --- |"
            for dir in packages/*; do
              [ -f "$dir/package.json" ] || continue
              private=$(node -p "require('./$dir/package.json').private === true")
              [ "$private" = "false" ] || continue

              name=$(node -p "require('./$dir/package.json').name")
              version=$(node -p "require('./$dir/package.json').version")
              tag="$name@$version"

              if npm view "$tag" version > /dev/null 2>&1; then npm_state="yes"; else npm_state="**NO**"; fi
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then tag_state="yes"; else tag_state="**NO**"; fi
              if gh release view "$tag" > /dev/null 2>&1; then rel_state="yes"; else rel_state="**NO**"; fi

              echo "| $name | $version | $npm_state | $tag_state | $rel_state |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the publish failed
        if: always() && steps.publish.outputs.code != '0'
        run: |
          echo "::error::Release failed: changeset publish exited ${{ steps.publish.outputs.code }}."
          exit 1
