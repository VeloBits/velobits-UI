name: Release

# Versioning is automatic; publishing is not.
#
#   push to main       → open/update the "Version Packages" PR. Never publishes.
#   workflow_dispatch  → publish whatever main currently declares.
#
# The split is deliberate. `@velobits-dev/ui` peers on tokens and icons at
# `^0.1.0`, and on a 0.x version a caret pins the MINOR — so changesets treats a
# bump of either sibling as a MAJOR for `ui`. Keeping the version step automatic
# means that shows up as a reviewable PR diff (`ui` jumping to 1.0.0) *before*
# anything reaches the registry, while the publish itself stays a decision
# somebody makes on purpose. See "Known" in packages/ui/CHANGELOG.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          # This is what writes the auth line into a temporary .npmrc. The
          # committed .npmrc deliberately carries only the registry mapping —
          # npm hard-fails on an unresolvable ${VAR} in it.
          registry-url: https://registry.npmjs.org

      # No auth needed to install: every @velobits-dev/* dep here is a workspace
      # link, resolved locally and never fetched.
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify publishable output before releasing
        run: npm run package:check

      # changesets/action@v1 branches on `hasPublishScript = !!getInput("publish")`
      # (src/index.ts:61). An empty string is falsy, so on a plain push this
      # reaches `case !hasChangesets && !hasPublishScript` (:68), which logs
      # "No changesets present …" and returns SUCCESS — a green no-op, not a
      # failure. With changesets pending it takes `case hasChangesets` (:157) and
      # opens the version PR regardless of this input. Only a manual dispatch
      # reaches the publish path (:73).
      - name: Open version PR (push) or publish (manual dispatch)
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: ${{ github.event_name == 'workflow_dispatch' && 'npm run release' || '' }}
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # GITHUB_TOKEN opens the "Version Packages" PR. NODE_AUTH_TOKEN is a
          # separate npm automation token — publishing to npmjs.org does NOT
          # accept GITHUB_TOKEN, which is what makes this the one required secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
