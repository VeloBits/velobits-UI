name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          # This is what writes the auth line into a temporary .npmrc. The
          # committed .npmrc deliberately carries only the registry mapping —
          # npm hard-fails on an unresolvable ${VAR} in it.
          registry-url: https://registry.npmjs.org

      # No auth needed to install: every @velobits-dev/* dep here is a workspace
      # link, resolved locally and never fetched.
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify publishable output before releasing
        run: npm run package:check

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # GITHUB_TOKEN opens the "Version Packages" PR. NODE_AUTH_TOKEN is a
          # separate npm automation token — publishing to npmjs.org does NOT
          # accept GITHUB_TOKEN, which is what makes this the one required secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
