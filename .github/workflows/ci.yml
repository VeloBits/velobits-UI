name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      # No token here: every @velobits-dev/* dep in this repo is a workspace
      # link, resolved locally and never fetched. Only `release.yml` publishes,
      # and that is the one job needing the NPM_TOKEN secret.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # The contrast gate lives here. A palette edit that breaks a WCAG target
      # fails this step rather than shipping.
      - name: Test
        run: npm run test

      # publint + attw are what catch the TS-version skew across consumers:
      # the editor app is on TS 6.0.3, the Keycloak theme ~6.0.2, the dashboard app 5.9.3.
      # A .d.ts that fails to resolve under one of them breaks quietly, which is
      # why this is a gate and not a nice-to-have.
      - name: Package exports and types
        run: npm run package:check

      - name: Bundle size
        run: npm run size

      # Proves the shadcn half of the distribution actually resolves: every file
      # a registry item references exists, and every registryDependency resolves.
      # Without this, the failure surfaces on a consumer's machine.
      - name: Registry build
        run: npm run registry:build

      - name: Docs build
        run: npm run build -w @velobits-dev/docs
